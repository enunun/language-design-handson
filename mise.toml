[tools]
rtk = "0.49.0"
lefthook = "2.1.14"
node = "26.10.0"
pnpm = "12.6.0"
# Lean 4はmiseではなくelanで入れる(.devcontainer/Dockerfile)．版はlean-toolchainで固定する．
# ツールを追加・更新したら`mise lock --global`を実行し，更新されたmise.lockもコミットする．
# devcontainerではこのファイルをグローバル設定として読む(MISE_GLOBAL_CONFIG_FILE)ので，--globalが要る．

[settings]
lockfile = true

[tasks.install]
description = "依存パッケージをインストールする"
run = "pnpm install --frozen-lockfile"

[tasks.lint]
description = "文書を検査する(textlint，markdownlint，Mermaidの図，数式)"
depends = ["install"]
run = "pnpm lint"

[tasks.test]
description = "すべてのIterationの演習と解答をビルドし，テスト(証明)を検査する"
run = """
#!/usr/bin/env bash
set -eu
shopt -s nullglob
for dir in iterations/iteration-*/exercise iterations/iteration-*/solution; do
  echo "== $dir"
  (cd "$dir" && lake build && lake test)
done
"""

[tasks.check-design]
description = "設計書(design/)と実装を照合する．パッケージのディレクトリで実行すると，そのパッケージだけを照合する"
depends = ["install"]
run = "node scripts/check-design.mjs"

[tasks.check-exercises]
description = "各Iterationの演習が，前のIterationの解答と同じ状態から始まることを確かめる"
run = "node scripts/check-exercises.mjs"

[tasks.hooks]
description = "Gitのフック(コミット時の検査)を設定する"
run = "lefthook install"

[tasks.setup]
description = "開発環境を整える(依存パッケージ，Gitのフックなど)"
depends = ["install", "hooks"]

[tasks.check]
description = "リント，全パッケージのテスト，設計書の照合，演習と前の解答の一致をまとめて確かめる(CIと同じ)"
depends = ["lint", "test", "check-design", "check-exercises"]
