[tools]
rtk = "0.49.0"
lefthook = "2.1.14"
node = "26.10.0"
pnpm = "12.6.0"
# Lean 4はmiseではなくelanで入れる(.devcontainer/Dockerfile)．版はlean-toolchainで固定する．
# ツールを追加・更新したら`mise lock`を実行し，生成されたmise.lockもコミットする．

[settings]
lockfile = true

[tasks.install]
description = "依存パッケージをインストールする"
run = "pnpm install --frozen-lockfile"

[tasks.fmt]
description = "コードと文書を整形する"
depends = ["install"]
run = "echo 'Leanには標準の整形ツールがないため，整形は行わない'"

[tasks.gen]
description = "模範解答(Solutions/)から演習ファイル(Handson/)を作り直す"
run = "node scripts/gen-handson.mjs"

[tasks.handson]
description = "演習の証明が完成したか(sorryが残っていないか)を章ごとに確かめる"
run = """
#!/usr/bin/env bash
set -u
lake build Handson >/dev/null 2>&1 || { lake build Handson; exit 1; }
status=0
for f in Handson/*.lean; do
  if out=$(lake env lean -DwarningAsError=true -DautoImplicit=false "$f" 2>&1); then
    echo "完成   $f"
  else
    echo "未完成 $f"
    echo "$out" | sed 's/^/    /'
    status=1
  fi
done
exit $status
"""

[tasks.lint]
description = "すべてのリントを実行する"
depends = ["install"]
run = "pnpm lint"

[tasks.test]
description = "模範解答の性質がすべて証明済みであることと，演習ファイルが模範解答と一致することを確かめる"
run = [
  "lake build Solutions",
  "node scripts/gen-handson.mjs --check",
  "lake build Handson",
]

[tasks.hooks]
description = "Gitのフック(コミット時の検査)を設定する"
run = "lefthook install"

[tasks.setup]
description = "開発環境を整える(依存パッケージ，Gitのフックなど)"
depends = ["install", "hooks"]

[tasks.check]
description = "整形の検査，リント，単体テストなどをまとめて実行する(CIと同じ)"
depends = ["lint", "test"]
